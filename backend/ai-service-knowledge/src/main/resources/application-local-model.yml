# 本地模型 profile：需预先准备 data/model-cache/all-MiniLM-L6-v2/{model.onnx,tokenizer.json}
# 启动：mvn -pl backend/ai-service-knowledge spring-boot:run "-Dspring-boot.run.profiles=dev,local-model"
spring:
  ai:
    embedding:
      transformer:
        onnx:
          model-uri: "${EMBEDDING_MODEL_URI:file:./data/model-cache/all-MiniLM-L6-v2/model.onnx}"
        tokenizer:
          uri: "${EMBEDDING_TOKENIZER_URI:file:./data/model-cache/all-MiniLM-L6-v2/tokenizer.json}"
