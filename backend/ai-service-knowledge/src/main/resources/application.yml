server:
  port: 9202

spring:
  application:
    name: ai-service-knowledge
  config:
    import:
      - optional:file:./deploy/env/current.env[.properties]
      - optional:file:../../deploy/env/current.env[.properties]
      - optional:classpath:config/satoken-common.yml
      - optional:classpath:config/nacos-client.yml
      - optional:nacos:application-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:ai-service-knowledge.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:file:./data/model-cache/local-model.properties
      - optional:file:../../backend/ai-service-knowledge/data/model-cache/local-model.properties
      - optional:file:./backend/ai-service-knowledge/data/model-cache/local-model.properties
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:${spring.profiles.active:dev}}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
  ai:
    embedding:
      transformer:
        cache:
          directory: ${EMBEDDING_CACHE_DIR:./data/model-cache}
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.baomidou.mybatisplus.extension.handlers

app:
  knowledge:
    storage-dir: ${KNOWLEDGE_STORAGE_DIR:./data/knowledge-base}
    rag-top-k: 5
    similarity-threshold: 0.65
    embedding-model: ${EMBEDDING_MODEL_NAME:all-MiniLM-L6-v2}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.example.ai.knowledge: INFO
