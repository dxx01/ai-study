server:
  port: 9100

spring:
  application:
    name: ai-gateway
  config:
    import:
      - optional:file:./deploy/env/current.env[.properties]
      - optional:file:../../deploy/env/current.env[.properties]
      - optional:classpath:config/satoken-common.yml
      - optional:classpath:config/nacos-client.yml
      - optional:nacos:application-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:ai-gateway.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:${spring.profiles.active:dev}}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

# 路由在 Nacos ai-gateway.yaml（lb://）；本地须能连 Nacos
app:
  gateway:
    auth:
      whitelist:
        - /auth/login
        - /auth/register
        - /actuator/**
      blacklist: []

logging:
  level:
    org.springframework.cloud.gateway: INFO
