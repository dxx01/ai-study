server:
  port: 9201

spring:
  application:
    name: ai-service-llm
  config:
    import:
      - optional:file:./deploy/env/current.env[.properties]
      - optional:file:../../deploy/env/current.env[.properties]
      - optional:classpath:config/satoken-common.yml
      - optional:classpath:config/nacos-client.yml
      - optional:nacos:application-common.yaml?group=DEFAULT_GROUP&refreshEnabled=true
      - optional:nacos:ai-service-llm.yaml?group=DEFAULT_GROUP&refreshEnabled=true
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:${spring.profiles.active:dev}}
  # ai-common 传递了 MyBatis-Plus/JDBC，但本服务只做编排，不需要 DataSource
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
app:
  expert:
    id: home-health-advisor
    display-name: 居家营养与健康科普顾问
    tagline: 基于本地资料与可选联网检索的科普助手（非诊疗）
    domains:
      - 均衡膳食与营养素
      - 运动与作息
      - 常见症状科普与就医指引
      - 慢病生活方式管理（科普层面）
    principles:
      - 优先依据用户上传或内置知识库中的内容回答，并说明依据
      - 信息不足时明确说明不确定，并建议就医或查阅权威渠道
      - 不提供诊断、不开具处方、不替代线下医生
      - 涉及急症或严重症状时，优先建议立即就医或拨打 120
    disclaimer: 本助手仅提供健康科普与一般性建议，不构成医疗诊断或治疗方案；如有不适请及时就医。
  # 多模型：每个 provider 都是 OpenAI 兼容端点，切换/新增只改配置
  ai:
    default-provider: ${AI_DEFAULT_PROVIDER:deepseek}
    providers:
      deepseek:
        base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_CHAT_MODEL:deepseek-chat}
        temperature: 0.7
        max-tokens: 2048
      deepseek-flash:
        base-url: ${OPENAI_BASE_URL:https://api.deepseek.com}
        api-key: ${OPENAI_API_KEY:}
        model: ${OPENAI_CHAT_MODEL_FLASH:deepseek-flash}
        temperature: 0.7
        max-tokens: 2048
      # 其他 OpenAI 兼容供应商示例，启用时填好 key 并删掉注释：
      # qwen:
      #   base-url: ${QWEN_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode}
      #   api-key: ${QWEN_API_KEY:}
      #   model: ${QWEN_MODEL:qwen-plus}
  web-search:
    enabled: ${WEB_SEARCH_ENABLED:false}
    tavily-api-key: ${TAVILY_API_KEY:}
    max-results: 5
  rate-limit:
    enabled: ${CHAT_RATE_LIMIT_ENABLED:true}
    chat-per-minute: ${CHAT_RATE_LIMIT_PER_MINUTE:20}
    chat-per-day: ${CHAT_RATE_LIMIT_PER_DAY:200}
  services:
    knowledge-base-url: ${KNOWLEDGE_SERVICE_URL:http://127.0.0.1:9202}
    conversation-base-url: ${CONVERSATION_SERVICE_URL:http://127.0.0.1:9203}

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    org.springframework.ai: INFO
    com.example.ai.llm: INFO

