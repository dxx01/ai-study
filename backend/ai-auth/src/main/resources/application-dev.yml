spring:
  # 本机开发从 gitignored 的 deploy/env/local-mysql.env 读取 MYSQL_*（模块目录或仓库根目录启动均可）
  config:
    import:
      - optional:file:./deploy/env/local-mysql.env[.properties]
      - optional:file:../../deploy/env/local-mysql.env[.properties]
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:127.0.0.1}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:ai_platform}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.baomidou.mybatisplus.extension.handlers
