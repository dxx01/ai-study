spring:
  datasource:
    url: jdbc:h2:mem:ai_auth_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  type-handlers-package: com.baomidou.mybatisplus.extension.handlers
