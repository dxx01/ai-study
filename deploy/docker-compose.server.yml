# 阿里云 / 单机服务器：MySQL + Redis + Nacos（Docker 管理）
# 使用：在 deploy 目录执行（密码等同 deploy/env/server.env）
#   docker compose --env-file env/server.env -f docker-compose.server.yml up -d
services:
  mysql:
    image: mysql:8.4
    container_name: ai-study-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - env/server.env
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in env/server.env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ai_platform}
      MYSQL_USER: ${MYSQL_USER:-ai}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in env/server.env}
    command: >
      mysqld
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-time-zone=+08:00
    volumes:
      - ai_study_mysql_data:/var/lib/mysql
      - ./sql/01-init-database.sql:/docker-entrypoint-initdb.d/01-init-database.sql:ro
      - ./sql/02-schema.sql:/docker-entrypoint-initdb.d/02-schema.sql:ro
      - ./sql/03-seed-data.sql:/docker-entrypoint-initdb.d/03-seed-data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: ai-study-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    env_file:
      - env/server.env
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in env/server.env}
      - --save
      - ""
      - --appendonly
      - no
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: ai-study-nacos
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    env_file:
      - env/server.env
    environment:
      MODE: standalone
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: ${NACOS_DB_USER:-nacos}
      MYSQL_SERVICE_PASSWORD: ${NACOS_DB_PASSWORD:?set NACOS_DB_PASSWORD in env/server.env}
      MYSQL_SERVICE_DB_PARAM: characterEncoding=utf8&connectTimeout=1000&socketTimeout=3000&autoReconnect=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:?set NACOS_AUTH_TOKEN in env/server.env}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:?set NACOS_AUTH_IDENTITY_KEY in env/server.env}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:?set NACOS_AUTH_IDENTITY_VALUE in env/server.env}
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/liveness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

volumes:
  ai_study_mysql_data:
